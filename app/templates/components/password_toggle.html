{# Show/hide control for a password input. Pass input_id. #}
<button type="button"
        class="absolute inset-y-0 right-0 px-3 text-sm font-medium text-primary-600 hover:text-primary-800 min-h-11"
        data-password-toggle="{{ input_id }}"
        aria-controls="{{ input_id }}"
        aria-label="{{ _('Show password') }}">{{ _('Show') }}</button>
<script nonce="{{ csp_nonce() }}">
(function () {
  var btn = document.querySelector('[data-password-toggle="{{ input_id }}"]');
  var input = document.getElementById('{{ input_id }}');
  if (!btn || !input) return;
  var showLabel = {{ _('Show')|tojson }};
  var hideLabel = {{ _('Hide')|tojson }};
  var showAria = {{ _('Show password')|tojson }};
  var hideAria = {{ _('Hide password')|tojson }};
  btn.addEventListener('click', function () {
    var hidden = input.type === 'password';
    input.type = hidden ? 'text' : 'password';
    btn.textContent = hidden ? hideLabel : showLabel;
    btn.setAttribute('aria-label', hidden ? hideAria : showAria);
  });
})();
</script>

<!doctype html>
{# Full-screen QR code for a slide or shared screen. #}
<html lang="{{ current_lang|default('en') }}" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ consultation.question }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}?v={{ css_version }}">
</head>
<body class="flex min-h-full flex-col items-center justify-center bg-white p-8 text-center text-gray-900">
  <p class="text-lg font-semibold uppercase tracking-wider text-gray-500">{{ consultation.organisation_name }}</p>
  <h1 class="mt-3 max-w-4xl text-3xl font-bold leading-tight sm:text-5xl">{{ consultation.question }}</h1>
  <img src="{{ url_for('consultations.qr_code', consultation_id=consultation.id, fmt='svg') }}" alt="{{ _('QR code that opens the consultation') }}"
       class="mt-8 h-[min(52vh,26rem)] w-[min(52vh,26rem)]">
  <p class="mt-6 text-2xl font-semibold">{{ _('Point your phone camera at the code') }}</p>
  <p class="mt-2 text-lg text-gray-600">{{ _('Two minutes. No login. Anonymous.') }}</p>
  <p class="mt-6 break-all font-mono text-base text-gray-500">{{ participant_url }}</p>
</body>
</html>

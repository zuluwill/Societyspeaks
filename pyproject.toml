# Tool configuration only. Python dependencies live in requirements.txt
# (installed by the Dockerfile). Do not reintroduce a Poetry/[project]
# dependency ledger here — it fed false Dependabot alerts alongside the
# real requirements.txt pins (see commit ac1fe26).

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
# https://beta.ruff.rs/docs/configuration/
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

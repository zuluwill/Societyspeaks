# Automated dependency update PRs. Each PR runs the full test suite (CI),
# so upgrades are reviewed+tested individually instead of arriving silently
# on the next image rebuild (see OPS.md "Dependency pinning policy").
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Only open a PR when the existing specifier no longer admits the new
    # version. Without this, ranged pins (gunicorn>=22,<27) generate noisy
    # "raise the floor" PRs that change nothing about what pip installs.
    versioning-strategy: increase-if-necessary
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    # Majors arrive as individual PRs so breaking changes are reviewed alone.
    ignore:
      # atproto still declares cryptography<47. The patched wheel (>=50) is
      # force-reinstalled in scripts/install_python_deps.sh. Raising this
      # resolve ceiling makes `pip install -r` fail until atproto relaxes.
      - dependency-name: "cryptography"
      # StripeObject dropped dict-style .get in v13; last incident was the
      # Replit→Render migration (OPS.md). Security advisories still open PRs.
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
      # redis-py 6+ is a client major. Stay on the 5.x exact pin until a
      # dedicated upgrade; patches on 5.x still group as python-minor-patch.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      # Flask-Limiter 4 is a config/API major. Stay on the 3.x exact pin
      # (currently 3.12); 3.x patches still group as python-minor-patch.
      - dependency-name: "flask-limiter"
        update-types: ["version-update:semver-major"]
      # 0.10+ is the next 0.x minor. 0.16 changes FileSystemCache hashing
      # (md5 → sha256), which would orphan flask_session files on Redis fallback.
      # Patches on 0.9.x and security advisories still open PRs.
      - dependency-name: "cachelib"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-all:
        update-types: ["minor", "patch"]
    ignore:
      # Tailwind 4 is a deliberate CSS rewrite, not a Dependabot drive-by.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # nanoid 4/5/6 are ESM majors. postcss 8 / Tailwind 3 need the 3.x
      # line (GHSA-2v37-7h3g-55p8 is patched in 3.3.18; package.json overrides
      # pin that). A major bump here would break the CSS build.
      - dependency-name: "nanoid"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Stay on the Python minor we build and test against (3.11). Major
      # bumps (3.12+) are a deliberate platform change, not weekly drive-bys.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]

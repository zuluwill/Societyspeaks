# Probes HTTPS targets in guided-journey optional-reading URLs (global curriculum + country packs).
# Purpose: catch genuinely dead references (404/410/DNS/TLS) before readers hit them.
# Not a site-uptime monitor — gov/WAF hosts often timeout or 403 from GitHub
# Actions IPs while loading fine in a browser; those are WARN (soft), not FAIL.
# Fails on definitive dead links. HTTP 401/403/429/444 and post-retry timeouts
# default to warn (set JOURNEY_READING_LINK_STRICT=1 or --strict-forbidden to
# fail on 401/403 only — timeouts stay soft).
name: Journey reading links

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - "app/programmes/journey_seed.py"
      - "app/programmes/journey_reading_enrichment.py"
      - "app/programmes/journey_reading_url_index.py"
      - "app/programmes/journey_reading_link_probe.py"
      - "scripts/verify_journey_reading_links.py"
      - ".github/workflows/journey-reading-links.yml"
  pull_request:
    paths:
      - "app/programmes/journey_seed.py"
      - "app/programmes/journey_reading_enrichment.py"
      - "app/programmes/journey_reading_url_index.py"
      - "app/programmes/journey_reading_link_probe.py"
      - "scripts/verify_journey_reading_links.py"
      - ".github/workflows/journey-reading-links.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: bash scripts/install_python_deps.sh

      - name: Probe journey reading URLs
        env:
          PYTHONPATH: .
        # Keep concurrency modest: 18 parallel probes from one cloud IP
        # trips rate limits / WAF slow-paths on gov CDNs and creates flake.
        run: python3 scripts/verify_journey_reading_links.py --workers 8 --timeout 28

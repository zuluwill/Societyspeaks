# Weekly + on-demand vulnerability audit of the dependencies as actually
# resolved (scripts/install_python_deps.sh — same path the production image
# and Tests CI use, including the cryptography override past atproto's <47).
name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, before the Dependabot PRs land
  workflow_dispatch:
  pull_request:
    paths:
      - requirements.txt
      - Dockerfile
      - scripts/install_python_deps.sh
      - .github/workflows/security.yml

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies as production would
        run: bash scripts/install_python_deps.sh
      - name: Assert cryptography override landed
        # Guard against a future edit that drops the force-reinstall while
        # atproto still caps <47 — pip-audit would then fail, but only after
        # a full resolve; this fails fast with a clear message.
        run: |
          python3 - <<'PY'
          from importlib.metadata import version
          raw = version("cryptography")
          parts = tuple(int(p) for p in raw.split(".")[:3])
          assert parts >= (48, 0, 1), f"expected cryptography>=48.0.1 after override, got {raw}"
          print(f"cryptography {raw} OK (GHSA-537c override)")
          PY
      - name: Audit installed environment
        run: |
          python3 -m pip install pip-audit
          pip-audit --skip-editable

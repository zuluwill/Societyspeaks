# Render Blueprint — Society Speaks
# Docs: https://render.com/docs/blueprint-spec
#
# Three services share the same Docker image:
#   societyspeaks-web        – Gunicorn/Gevent HTTP workers
#   societyspeaks-scheduler  – APScheduler background jobs
#   societyspeaks-consensus  – scikit-learn clustering worker
#
# IMPORTANT: Render IGNORES `sync: false` inside envVarGroups (those keys
# never appear). Put secrets on each service with sync: false, or add them
# manually in Environment Groups → Edit. See RENDER_DEPLOY.md.

envVarGroups:
  # Non-secret config shared across services (safe to commit values).
  - name: societyspeaks-config
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: run.py
      # Explicit production-send gate (do NOT use FLASK_ENV for this).
      # Keep Replit paused/off while this is set on Render.
      - key: DEPLOYED_PRODUCTION
        value: "1"
      # Single Sentry environment label for all services (avoid "prod" vs "production").
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: APP_BASE_URL
        value: https://societyspeaks.io
      - key: SITE_URL
        value: https://societyspeaks.io
      - key: POSTHOG_HOST
        value: https://eu.i.posthog.com
      - key: BRIEF_FROM_EMAIL
        value: hello@brief.societyspeaks.io
      - key: RESEND_FROM_EMAIL
        value: "Society Speaks <hello@brief.societyspeaks.io>"
      - key: RESEND_DAILY_FROM_EMAIL
        value: "Daily Questions <daily@brief.societyspeaks.io>"
      - key: RESEND_TRANSACTIONAL_FROM_EMAIL
        value: "Society Speaks <hello@societyspeaks.io>"
      - key: RESEND_REPLY_TO
        value: hello@societyspeaks.io
      - key: AUDIO_ENABLED
        value: "false"
      - key: X_POSTING_ENABLED
        value: "false"
      - key: EMAIL_ANALYTICS_RECORD_RESEND_WEBHOOK_CLICKS
        value: "false"
      - key: STRIPE_PERSONAL_MONTHLY_PRICE_ID
        value: price_1T0InvAjRojnyfWfBrvh6xe8
      - key: STRIPE_PERSONAL_YEARLY_PRICE_ID
        value: price_1T0IoaAjRojnyfWfKlEFMxme

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Web — Gunicorn + Gevent HTTP workers
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: societyspeaks-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: frankfurt
    # Lightweight liveness only — do not use "/" (homepage hits DB/Redis/sessions
    # and fails during worker warmup, which triggers deploy "connection refused" alerts).
    healthCheckPath: /health
    preDeployCommand: flask db upgrade
    envVars:
      - fromGroup: societyspeaks-config
      - key: APP_ROLE
        value: web
      - key: DISABLE_SCHEDULER
        value: "1"
      - key: PORT
        value: "5000"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: SELF_SERVE_TRIAL_ENABLED
        value: "true"
      # Secrets — set in dashboard (Blueprint create prompts; updates ignore these)
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: GUARDIAN_API_KEY
        sync: false
      - key: PARTNER_KEY_SECRET
        sync: false
      - key: PARTNER_STRIPE_PRICE_STARTER
        sync: false
      - key: PARTNER_STRIPE_PRICE_PROFESSIONAL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: eu-west-2

  - type: worker
    name: societyspeaks-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: frankfurt
    dockerCommand: python3 scripts/run_scheduler.py
    envVars:
      - fromGroup: societyspeaks-config
      - key: APP_ROLE
        value: scheduler
      # Keep the process long-lived on Render (0 = no timed self-exit).
      - key: SCHEDULER_MAX_RUNTIME_SECONDS
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: GUARDIAN_API_KEY
        sync: false
      - key: PARTNER_KEY_SECRET
        sync: false
      - key: PARTNER_STRIPE_PRICE_STARTER
        sync: false
      - key: PARTNER_STRIPE_PRICE_PROFESSIONAL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: eu-west-2

  - type: worker
    name: societyspeaks-consensus-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: frankfurt
    dockerCommand: python3 scripts/run_consensus_worker.py
    envVars:
      - fromGroup: societyspeaks-config
      - key: APP_ROLE
        value: worker
      - key: CONSENSUS_WORKER_PROCESS
        value: "1"
      - key: CONSENSUS_WORKER_ID
        value: worker-1
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: GUARDIAN_API_KEY
        sync: false
      - key: PARTNER_KEY_SECRET
        sync: false
      - key: PARTNER_STRIPE_PRICE_STARTER
        sync: false
      - key: PARTNER_STRIPE_PRICE_PROFESSIONAL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: eu-west-2

  # ─────────────────────────────────────────────────────────────────────────
  # Daily Neon → S3 backup (03:00 UTC)
  # ─────────────────────────────────────────────────────────────────────────
  - type: cron
    name: societyspeaks-db-backup
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    schedule: "0 3 * * *"
    dockerCommand: python3 scripts/backup_neon_to_s3.py
    envVars:
      - fromGroup: societyspeaks-config
      - key: DATABASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: eu-west-2
      - key: BACKUP_S3_PREFIX
        value: db-backups/
      - key: BACKUP_RETENTION_DAYS
        value: "30"
